<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <title>Aira the Signal Starling — Round 38 production pose sheet</title>
  <desc>Eight-state flat vector construction sheet for the Sky Voice adult IELTS guide.</desc>
  <defs>
    <style>
      .navy{fill:#0E2D5E}.blue{fill:#1655D8}.orange{fill:#EB9D13}.cream{fill:#FFF4D6}.white{fill:#FFFFFF}
      .sep{stroke:#0E2D5E;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .label{font-family:"Nunito Sans",Nunito,Arial,sans-serif;font-size:22px;font-weight:800;letter-spacing:1px;fill:#0E2D5E;text-anchor:middle}
    </style>

    <!-- Permanent three-segment broken orbit. The geometry never changes. -->
    <g id="orbit">
      <path d="M-91-63A108 90 0 0 1 5-111" fill="none" stroke="#1655D8" stroke-width="18" stroke-linecap="round"/>
      <path d="M39-106A108 90 0 0 1 106-18" fill="none" stroke="#0E2D5E" stroke-width="18" stroke-linecap="round"/>
      <path d="M105 18A108 90 0 0 1 58 76" fill="none" stroke="#EB9D13" stroke-width="18" stroke-linecap="round"/>
    </g>

    <!-- One two-peak waveform tail; the lower peak contains the speech notch. -->
    <g id="tail">
      <path class="blue" d="M0 0C-33-18-78-18-126 10C-105-30-65-54-18-39C-5-34 3-22 0 0Z"/>
      <path class="blue" d="M2 8C-31 2-76 17-124 55C-108 21-76-2-39-3C-20-4-9 4 2 8ZM-91 31C-78 36-66 35-53 27C-63 47-79 53-97 48Z" fill-rule="evenodd"/>
      <path class="sep" d="M-111 20C-81-1-48-7-17 3"/>
    </g>

    <!-- One wing, exactly three broad waveform lobes, sharing a registered shoulder. -->
    <g id="wing">
      <path class="blue" d="M0 0C24-27 63-44 108-39C95-23 82-9 64 5C82 6 99 13 112 25C94 35 73 41 52 40C68 51 79 64 85 80C61 74 38 79 17 91C8 64 3 35 0 0Z"/>
      <path class="sep" d="M13 7C38-5 67-7 96-1M18 17C42 20 68 27 98 26M20 28C44 39 64 54 78 70"/>
    </g>

    <!-- Connected leg and three-toe foot. Feet are never detached from the leg. -->
    <g id="leg">
      <path class="navy" d="M-7 0C-9 39-10 81-6 116L-34 129C-43 133-39 141-29 138L-5 133L-18 151C-23 159-13 164-8 155L3 139L8 157C10 166 20 163 17 153L13 132L41 138C50 140 53 132 43 128L10 116C12 77 11 37 7 0Z"/>
    </g>

    <!-- Side/three-quarter head key: one long neck-head mass, two crest sweeps, one precise beak. -->
    <g id="head-side">
      <path class="navy" d="M-28-71C-31-111-35-157-8-181C14-201 51-201 75-183C88-173 91-160 91-151L151-128L84-122C71-116 65-106 61-90L43-58Z"/>
      <path class="blue" d="M-7-181C12-214 50-218 83-196C51-196 27-188 5-166Z"/>
      <path class="navy" d="M-10-184C-30-190-42-204-43-220C-21-206 2-207 24-216C17-199 6-190-10-184Z"/>
      <path class="blue" d="M-4-197C-20-205-27-218-25-230C-7-216 10-218 29-228C21-210 11-201-4-197Z"/>
      <path class="cream" d="M-18-69C-15-109-4-143 25-156C43-164 62-159 79-149C56-144 47-127 44-108C40-87 27-71 9-57Z"/>
      <circle cx="51" cy="-166" r="7" class="orange"/>
      <circle cx="53" cy="-168" r="3.2" class="navy"/>
      <path class="sep" d="M38-178Q51-185 64-178"/>
      <path class="orange" d="M84-122L145-128L91-137Z" opacity="0"/>
    </g>

    <!-- Frontal registered key uses the same proportions and feature sizes. -->
    <g id="head-front">
      <path class="navy" d="M-36-69C-38-112-40-157-16-181C4-201 36-201 56-181C80-157 78-112 76-69L30-52Z"/>
      <path class="blue" d="M-17-181C-1-214 34-219 64-196C36-196 15-188-5-166Z"/>
      <path class="navy" d="M-15-184C-33-192-43-205-42-221C-22-207-1-208 19-217C12-200 2-190-15-184Z"/>
      <path class="blue" d="M-10-198C-25-207-31-219-28-231C-12-217 5-219 22-229C15-211 5-201-10-198Z"/>
      <path class="cream" d="M-24-67C-18-112-7-145 20-157C47-145 58-112 64-67L21-51Z"/>
      <path class="navy" d="M9-158L20-139L31-158Z"/>
      <circle cx="2" cy="-165" r="7" class="orange"/><circle cx="38" cy="-165" r="7" class="orange"/>
      <circle cx="4" cy="-167" r="3.2" class="navy"/><circle cx="36" cy="-167" r="3.2" class="navy"/>
      <path class="sep" d="M-8-178Q2-184 12-179M28-179Q38-184 48-178"/>
    </g>

    <g id="torso">
      <path class="navy" d="M0-93C47-83 66-39 61 10C56 61 33 112 0 139C-33 112-56 61-61 10C-66-39-47-83 0-93Z"/>
      <path class="cream" d="M-34-74Q0-48 34-74L28-55Q0-36-28-55Z"/>
      <path class="orange" d="M0-38L8-17L29-9L8-1L0 20L-8-1L-29-9L-8-17Z"/>
    </g>

    <g id="label-chip">
      <rect x="-164" y="-23" width="328" height="46" rx="23" class="white" stroke="#0E2D5E" stroke-width="4"/>
      <rect x="-155" y="-14" width="310" height="28" rx="14" fill="none" stroke="#1655D8" stroke-width="2"/>
    </g>

    <g id="signal-arcs">
      <path d="M0 0Q18-15 36 0" fill="none" stroke="#EB9D13" stroke-width="7" stroke-linecap="round"/>
      <path d="M-4-16Q18-35 40-16" fill="none" stroke="#EB9D13" stroke-width="7" stroke-linecap="round"/>
    </g>

    <g id="card">
      <rect x="-70" y="-48" width="140" height="96" rx="14" class="cream" stroke="#0E2D5E" stroke-width="5"/>
      <circle cx="-36" cy="0" r="20" fill="none" stroke="#EB9D13" stroke-width="10"/>
      <path d="M4-20H48M4 0H42M4 20H31" stroke="#1655D8" stroke-width="9" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- FRONT -->
  <g transform="translate(190 220) scale(.88)">
    <use href="#orbit"/>
    <use href="#tail" transform="translate(-40 68) rotate(-8) scale(.72)"/>
    <use href="#torso"/>
    <use href="#head-front"/>
    <use href="#wing" transform="translate(-45 -52) rotate(99) scale(.74)"/>
    <use href="#wing" transform="translate(45 -52) scale(-.74 .74) rotate(99)"/>
    <path class="navy" d="M-23 120Q0 133 23 120L19 139Q0 149-19 139Z"/>
    <use href="#leg" transform="translate(-21 123) scale(.76)"/>
    <use href="#leg" transform="translate(21 123) scale(-.76 .76)"/>
  </g>
  <g transform="translate(192 472)"><use href="#label-chip"/><text class="label" y="8">FRONT</text></g>

  <!-- TRUE 3/4 -->
  <g transform="translate(566 220) scale(.88) rotate(-2)">
    <use href="#orbit"/>
    <use href="#tail" transform="translate(-43 64) rotate(-10) scale(.78)"/>
    <use href="#torso" transform="skewX(-4)"/>
    <use href="#head-side" transform="translate(-5 0) rotate(-2) scale(.93)"/>
    <use href="#wing" transform="translate(-38 -50) rotate(96) scale(.66)"/>
    <use href="#wing" transform="translate(43 -47) scale(-.78 .78) rotate(92)"/>
    <path class="navy" d="M-23 120Q0 133 23 120L19 139Q0 149-19 139Z"/>
    <use href="#leg" transform="translate(-24 121) rotate(4) scale(.76)"/>
    <use href="#leg" transform="translate(24 122) scale(-.76 .76) rotate(3)"/>
  </g>
  <g transform="translate(576 472)"><use href="#label-chip"/><text class="label" y="8">3/4</text></g>

  <!-- LISTENING -->
  <g transform="translate(950 220) scale(.88) rotate(2)">
    <use href="#orbit"/>
    <use href="#tail" transform="translate(-44 66) rotate(-12) scale(.77)"/>
    <use href="#torso"/>
    <use href="#head-side" transform="translate(-5 1) rotate(4) scale(.92)"/>
    <use href="#wing" transform="translate(-39 -50) rotate(96) scale(.69)"/>
    <use href="#wing" transform="translate(43 -50) scale(-.78 .78) rotate(194)"/>
    <use href="#signal-arcs" transform="translate(97 -154) rotate(90) scale(.8)"/>
    <path class="navy" d="M-23 120Q0 133 23 120L19 139Q0 149-19 139Z"/>
    <use href="#leg" transform="translate(-22 123) rotate(-3) scale(.76)"/>
    <use href="#leg" transform="translate(22 123) scale(-.76 .76) rotate(-3)"/>
  </g>
  <g transform="translate(960 472)"><use href="#label-chip"/><text class="label" y="8">LISTENING</text></g>

  <!-- SPEAKING -->
  <g transform="translate(1331 220) scale(.88) rotate(-4)">
    <use href="#orbit"/>
    <use href="#tail" transform="translate(-45 68) rotate(-12) scale(.78)"/>
    <use href="#torso"/>
    <use href="#head-side" transform="translate(-5 0) rotate(-5) scale(.93)"/>
    <path class="orange" d="M73-126L146-128L82-108Z"/>
    <use href="#wing" transform="translate(-40 -49) rotate(98) scale(.67)"/>
    <use href="#wing" transform="translate(40 -48) scale(-.82 .82) rotate(17)"/>
    <use href="#signal-arcs" transform="translate(151 -133) rotate(-5) scale(.72)"/>
    <path class="navy" d="M-23 120Q0 133 23 120L19 139Q0 149-19 139Z"/>
    <use href="#leg" transform="translate(-24 121) rotate(7) scale(.76)"/>
    <use href="#leg" transform="translate(24 122) scale(-.76 .76) rotate(6)"/>
  </g>
  <g transform="translate(1344 472)"><use href="#label-chip"/><text class="label" y="8">SPEAKING</text></g>

  <!-- READING -->
  <g transform="translate(190 730) scale(.88) rotate(3)">
    <use href="#orbit"/>
    <use href="#tail" transform="translate(-43 65) rotate(-8) scale(.76)"/>
    <use href="#torso"/>
    <use href="#head-side" transform="translate(-5 5) rotate(12) scale(.92)"/>
    <path class="cream" d="M38 5L135-8L121 80L24 91Z" stroke="#0E2D5E" stroke-width="5" stroke-linejoin="round"/>
    <path d="M55 24L113 16M50 43L105 35M46 62L89 56" stroke="#1655D8" stroke-width="6" stroke-linecap="round"/>
    <use href="#wing" transform="translate(-39 -48) rotate(98) scale(.68)"/>
    <use href="#wing" transform="translate(45 -31) scale(-.72 .72) rotate(45)"/>
    <path class="navy" d="M-23 120Q0 133 23 120L19 139Q0 149-19 139Z"/>
    <use href="#leg" transform="translate(-22 122) rotate(-2) scale(.76)"/>
    <use href="#leg" transform="translate(22 122) scale(-.76 .76) rotate(-1)"/>
  </g>
  <g transform="translate(192 984)"><use href="#label-chip"/><text class="label" y="8">READING</text></g>

  <!-- WRITING -->
  <g transform="translate(568 730) scale(.88) rotate(-2)">
    <use href="#orbit"/>
    <use href="#tail" transform="translate(-43 66) rotate(-10) scale(.77)"/>
    <use href="#torso"/>
    <use href="#head-side" transform="translate(-5 5) rotate(11) scale(.92)"/>
    <path class="cream" d="M29 19L119 8L108 88L19 96Z" stroke="#0E2D5E" stroke-width="5" stroke-linejoin="round"/>
    <path d="M43 38L96 31M40 56L87 50M37 74L73 69" stroke="#1655D8" stroke-width="6" stroke-linecap="round"/>
    <path d="M74 7L119-40" stroke="#EB9D13" stroke-width="10" stroke-linecap="round"/><path d="M119-40L129-50" stroke="#0E2D5E" stroke-width="6" stroke-linecap="round"/>
    <use href="#wing" transform="translate(-40 -49) rotate(98) scale(.67)"/>
    <use href="#wing" transform="translate(44 -35) scale(-.69 .69) rotate(31)"/>
    <path class="navy" d="M-23 120Q0 133 23 120L19 139Q0 149-19 139Z"/>
    <use href="#leg" transform="translate(-23 121) rotate(4) scale(.76)"/>
    <use href="#leg" transform="translate(23 122) scale(-.76 .76) rotate(4)"/>
  </g>
  <g transform="translate(576 984)"><use href="#label-chip"/><text class="label" y="8">WRITING</text></g>

  <!-- FEEDBACK -->
  <g transform="translate(951 730) scale(.88) rotate(2)">
    <use href="#orbit"/>
    <use href="#tail" transform="translate(-43 65) rotate(-11) scale(.76)"/>
    <use href="#torso"/>
    <use href="#head-side" transform="translate(-8 1) rotate(1) scale(.92)"/>
    <use href="#card" transform="translate(84 37) scale(.82)"/>
    <use href="#wing" transform="translate(-39 -48) rotate(98) scale(.68)"/>
    <use href="#wing" transform="translate(43 -37) scale(-.68 .68) rotate(43)"/>
    <path class="navy" d="M-23 120Q0 133 23 120L19 139Q0 149-19 139Z"/>
    <use href="#leg" transform="translate(-23 121) rotate(-5) scale(.76)"/>
    <use href="#leg" transform="translate(23 122) scale(-.76 .76) rotate(-4)"/>
  </g>
  <g transform="translate(960 984)"><use href="#label-chip"/><text class="label" y="8">FEEDBACK</text></g>

  <!-- CELEBRATION -->
  <g transform="translate(1332 730) scale(.88) rotate(-5)">
    <use href="#orbit"/>
    <use href="#tail" transform="translate(-43 65) rotate(-18) scale(.8)"/>
    <use href="#torso"/>
    <use href="#head-side" transform="translate(-4 -2) rotate(-8) scale(.93)"/>
    <path class="orange" d="M73-126L146-128L82-108Z"/>
    <path class="navy" d="M35-174Q50-187 65-174" fill="none" stroke="#0E2D5E" stroke-width="7" stroke-linecap="round"/>
    <use href="#wing" transform="translate(-40 -48) rotate(191) scale(.86)"/>
    <use href="#wing" transform="translate(40 -48) scale(-.86 .86) rotate(191)"/>
    <path class="navy" d="M-23 120Q0 133 23 120L19 139Q0 149-19 139Z"/>
    <use href="#leg" transform="translate(-23 121) rotate(-7) scale(.76)"/>
    <use href="#leg" transform="translate(28 116) scale(-.76 .76) rotate(36)"/>
    <use href="#signal-arcs" transform="translate(104 -112) rotate(35) scale(.64)"/>
  </g>
  <g transform="translate(1344 984)"><use href="#label-chip"/><text class="label" y="8">CELEBRATION</text></g>
</svg>
