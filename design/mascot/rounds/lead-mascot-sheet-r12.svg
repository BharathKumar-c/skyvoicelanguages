<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Aira, the Sky Ray Signal Guide</title>
  <desc id="desc">Eight flat vector states of an original manta-ray and speech-kite IELTS guide with four module marks and a signal tail.</desc>

  <defs>
    <style>
      .navy-fill { fill: #0E2D5E; }
      .blue-fill { fill: #1655D8; }
      .orange-fill { fill: #EB9D13; }
      .cream-fill { fill: #FFF4D6; }
      .white-fill { fill: #FFFFFF; }
      .navy-stroke { stroke: #0E2D5E; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .blue-stroke { stroke: #1655D8; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: #0E2D5E; font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 800; letter-spacing: 0.6px; text-anchor: middle; dominant-baseline: middle; }
      .dial-text { fill: #0E2D5E; font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    </style>

    <!-- Broad rounded-diamond signal body with a shallow concave leading edge. -->
    <path id="ray-body" class="blue-fill navy-stroke"
          d="M -82 -24
             Q -45 -73 0 -48
             Q 45 -73 82 -24
             Q 73 24 34 58
             Q 0 88 -34 58
             Q -73 24 -82 -24 Z"/>

    <!-- One reusable wing mass; the right wing is a mirrored instance. -->
    <path id="ray-wing" class="blue-fill navy-stroke"
          d="M -4 -23
             C -41 -66 -104 -84 -158 -57
             C -177 -47 -180 -25 -161 -14
             C -132 3 -114 27 -101 65
             C -68 55 -39 30 -4 18 Z"/>

    <!-- Long speech-tail with an orange four-point signal tip. -->
    <path id="tail-stem" d="M 0 54 C 3 100 -16 139 8 170 C 29 197 67 176 54 145"
          fill="none" stroke="#0E2D5E" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="tail-tip" d="M 54 127 L 64 143 L 81 145 L 65 155 L 62 173 L 52 157 L 35 154 L 50 145 Z"
          class="orange-fill navy-stroke" stroke-width="5"/>
    <g id="signal-tail">
      <use href="#tail-stem"/>
      <use href="#tail-tip"/>
    </g>

    <path id="forehead-wave" d="M -18 -48 L -9 -61 L 0 -51 L 10 -64 L 20 -49"
          fill="none" stroke="#0E2D5E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="module-marks">
      <rect x="-8" y="-5" width="16" height="21" rx="7" class="cream-fill" transform="rotate(45 0 5.5)"/>
      <rect x="-8" y="13" width="16" height="21" rx="7" class="cream-fill" transform="rotate(45 0 23.5)"/>
      <rect x="-8" y="31" width="16" height="21" rx="7" class="cream-fill" transform="rotate(45 0 41.5)"/>
      <rect x="-8" y="49" width="16" height="21" rx="7" class="cream-fill" transform="rotate(45 0 59.5)"/>
    </g>

    <g id="guide-face" fill="none" stroke="#0E2D5E" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -33 -32 L -16 -36 M 16 -36 L 33 -32" stroke-width="6"/>
      <path d="M -29 -24 H -17 M 17 -24 H 29" stroke-width="5"/>
      <path d="M -8 -12 Q 0 -7 8 -12" stroke-width="4"/>
    </g>

    <g id="guide-core">
      <use href="#ray-body"/>
      <use href="#forehead-wave"/>
      <use href="#guide-face"/>
      <use href="#module-marks"/>
    </g>

    <g id="passage-card">
      <rect x="-61" y="-39" width="122" height="78" rx="12" class="cream-fill navy-stroke" stroke-width="6"/>
      <path d="M -38 -19 H 35 M -38 0 H 43 M -38 19 H 22"
            fill="none" class="blue-stroke"/>
    </g>

    <g id="band-dial">
      <circle cx="0" cy="0" r="53" class="cream-fill navy-stroke" stroke-width="6"/>
      <path d="M -34 16 A 38 38 0 0 1 34 16" fill="none" class="blue-stroke"/>
      <path d="M 0 12 L 24 -10" fill="none" stroke="#EB9D13" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="12" r="7" class="orange-fill"/>
      <text x="-31" y="28" class="dial-text">1</text>
      <text x="31" y="28" class="dial-text">9</text>
    </g>

    <g id="label-pill">
      <rect x="-143" y="-24" width="286" height="48" rx="24" class="white-fill navy-stroke" stroke-width="6"/>
    </g>
  </defs>

  <!-- FRONT: wings level, signal tail held in its canonical S curve. -->
  <g id="pose-front" transform="translate(192 247) scale(0.82)">
    <use href="#signal-tail"/>
    <use href="#ray-wing"/>
    <use href="#ray-wing" transform="scale(-1 1)"/>
    <use href="#guide-core"/>
  </g>
  <g transform="translate(192 468)"><use href="#label-pill"/><text class="label">FRONT</text></g>

  <!-- 3/4: one foreshortened wing and a forward-banked body. -->
  <g id="pose-three-quarter" transform="translate(576 247) scale(0.82) rotate(4)">
    <use href="#signal-tail"/>
    <use href="#ray-wing" transform="scale(0.56 0.9)"/>
    <use href="#ray-wing" transform="scale(-1 1) rotate(-7)"/>
    <use href="#guide-core" transform="scale(0.92 1)"/>
  </g>
  <g transform="translate(576 468)"><use href="#label-pill"/><text class="label">3/4</text></g>

  <!-- LISTENING: banked body, near wing cupped toward the face, quiet tail. -->
  <g id="pose-listening" transform="translate(960 247) scale(0.82) rotate(-8)">
    <use href="#signal-tail"/>
    <use href="#ray-wing" transform="rotate(56) scale(0.70 0.84)"/>
    <use href="#ray-wing" transform="scale(-1 1) rotate(17)"/>
    <use href="#guide-core"/>
  </g>
  <g transform="translate(960 468)"><use href="#label-pill"/><text class="label">LISTENING</text></g>

  <!-- SPEAKING: open wings and one restrained signal burst. -->
  <g id="pose-speaking" transform="translate(1344 247) scale(0.82)">
    <use href="#signal-tail"/>
    <use href="#ray-wing" transform="rotate(-18)"/>
    <use href="#ray-wing" transform="scale(-1 1) rotate(-18)"/>
    <use href="#guide-core"/>
    <g fill="none" stroke="#EB9D13" stroke-width="9" stroke-linecap="round">
      <path d="M 74 -36 L 103 -49"/>
      <path d="M 81 -20 L 115 -20"/>
      <path d="M 74 -4 L 103 9"/>
    </g>
  </g>
  <g transform="translate(1344 468)"><use href="#label-pill"/><text class="label">SPEAKING</text></g>

  <!-- READING: diagonal bank with both wings supporting one passage card. -->
  <g id="pose-reading" transform="translate(192 748) scale(0.78) rotate(7)">
    <use href="#signal-tail"/>
    <use href="#ray-wing" transform="rotate(-34) scale(0.86)"/>
    <use href="#ray-wing" transform="scale(-1 1) rotate(-34) scale(0.86)"/>
    <use href="#guide-core"/>
    <use href="#passage-card" transform="translate(10 99) rotate(-5) scale(0.86)"/>
  </g>
  <g transform="translate(192 970)"><use href="#label-pill"/><text class="label">READING</text></g>

  <!-- WRITING: near wing steadies the card; orange tail tip meets its lower line. -->
  <g id="pose-writing" transform="translate(576 748) scale(0.78) rotate(-3)">
    <use href="#tail-stem" transform="rotate(-34)"/>
    <use href="#ray-wing" transform="rotate(-29) scale(0.88)"/>
    <use href="#ray-wing" transform="scale(-1 1) rotate(-12) scale(0.82)"/>
    <use href="#guide-core"/>
    <use href="#passage-card" transform="translate(100 92) rotate(-10) scale(0.78)"/>
    <use href="#tail-tip" transform="rotate(-34)"/>
  </g>
  <g transform="translate(576 970)"><use href="#label-pill"/><text class="label">WRITING</text></g>

  <!-- FEEDBACK: one wing presents the dial while the rotated tail indicates a result. -->
  <g id="pose-feedback" transform="translate(960 748) scale(0.78) rotate(-2)">
    <use href="#tail-stem" transform="rotate(-66)"/>
    <use href="#ray-wing" transform="rotate(4)"/>
    <use href="#ray-wing" transform="scale(-1 1) rotate(28) scale(0.76)"/>
    <use href="#guide-core"/>
    <use href="#band-dial" transform="translate(139 17) scale(0.82)"/>
    <use href="#tail-tip" transform="rotate(-66)"/>
  </g>
  <g transform="translate(960 970)"><use href="#label-pill"/><text class="label">FEEDBACK</text></g>

  <!-- CELEBRATION: wings form a high V and the signal tail resolves upward. -->
  <g id="pose-celebration" transform="translate(1344 746) scale(0.78)">
    <use href="#signal-tail" transform="rotate(160) scale(0.92)"/>
    <use href="#ray-wing" transform="rotate(67) scale(0.92)"/>
    <use href="#ray-wing" transform="scale(-1 1) rotate(67) scale(0.92)"/>
    <use href="#guide-core"/>
  </g>
  <g transform="translate(1344 970)"><use href="#label-pill"/><text class="label">CELEBRATION</text></g>
</svg>
